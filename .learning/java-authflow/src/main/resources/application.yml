server:
  port: 8080

spring:
  config:
    import: classpath:flows.yaml
  application:
    name: authflow
  jackson:
    property-naming-strategy: SNAKE_CASE
    default-property-inclusion: non_null
    serialization:
      write-enums-using-to-string: true
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      password: opsbase123
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0

authflow:
  storage:
    ttl: 900

logging:
  level:
    learning.authflow: DEBUG
    org.springframework.web: INFO
