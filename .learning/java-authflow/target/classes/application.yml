server:
  port: 8080

spring:
  config:
    import: classpath:flows.yaml
  application:
    name: authflow
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      password: ${REDIS_PASSWORD:-opsbase123}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0

authflow:
  storage:
    ttl: 900

logging:
  level:
    learning.authflow: DEBUG
    org.springframework.web: INFO
